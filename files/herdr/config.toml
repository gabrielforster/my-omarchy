onboarding = false
# ~/.config/herdr/config.toml
# Ported from .tmux.conf — herdr 0.7.5 key names
# Reload after editing: herdr server reload-config

[keys]
prefix = "ctrl+b"

# Navigate mode: vim motions walk the sidebar workspace list.
# Vertical pane movement moves to the arrows that workspaces gave up.
navigate_workspace_up   = "k"
navigate_workspace_down = "j"
navigate_pane_up        = "up"
navigate_pane_down      = "down"

split_horizontal = "prefix+\""
split_vertical = "prefix+%"

# Worktrees and workspaces each shift one key down the d/g pair:
#   prefix+shift+g  new worktree     (herdr default)
#   prefix+shift+d  remove worktree  (unbound by default; opens a confirmation)
#   prefix+d        close workspace  (was prefix+shift+d)
# Built-in new_worktree is unbound: on 0.9.0 it focuses the new worktree
# server-side but the attached client keeps rendering the old workspace about
# half the time. The popup command below creates it and lands the focus.
new_worktree = ""
remove_worktree = "prefix+shift+d"
close_workspace = "prefix+d"

cycle_pane_previous = ""
next_agent = "prefix+tab"
previous_agent = "prefix+shift+tab"

# jumps to the toast target; only fires while a toast is on screen
open_notification_target = "prefix+o"

# prefix+[ into copy mode, as in tmux
copy_mode = "prefix+["

# base-index 1 equivalent: tab jumps are 1-based
switch_tab = "prefix+1..9"

[ui]
# set -g mouse on
mouse_capture = true
copy_on_select = true

show_agent_labels_on_pane_borders = true
[theme]
name = "vesper"

auto_switch = false
[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

# Jump to next agent waiting on input, toast on screen or not.
[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = "/home/gabriel/.config/scripts/herdr-focus-blocked.sh"
description = "focus next waiting agent (blocked, then done)"

# Replaces the built-in prefix+shift+g worktree dialog: prompts for a branch
# name, then creates the worktree over the socket API with --focus so the
# attached client actually switches to it.
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "/home/gabriel/.config/scripts/herdr-new-worktree.sh"
description = "new worktree (focus follows)"
width = "70%"
height = "30%"
