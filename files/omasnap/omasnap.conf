# Omasnap (Omarchy's screenshot tool since 4.5). Every key is optional;
# see /usr/share/doc/omasnap/README.md for the full list.

[output]
# Omasnap saves every capture to disk by default. Off: a capture only goes to
# the clipboard and the timed preview; use Save in the preview/editor (or
# `omarchy capture screenshot <mode> save`) to keep one.
autosave = false
# Where explicit saves land (Omasnap's default).
directory = ~/Pictures/Screenshots
